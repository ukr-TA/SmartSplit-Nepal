<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSplit Nepal</title>
    <meta name="theme-color" content="#f4f6f5" />
    <script>
      // apply the saved theme before the page paints (avoids a white flash)
      try {
        var t = localStorage.getItem('smartsplit_theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta name="description" content="Split less. Settle smarter. Group expense splitting for Nepal." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
